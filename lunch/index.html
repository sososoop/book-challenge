<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>점심 주문판</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
/* 소소숲 디자인 시스템: 모눈 종이 바탕 + 진녹색 상단 바, 2px 검정 테두리, 직각, 납작 그림자, 강조 파랑·보조 민트 */
:root{
  --paper:#fffdf7; --grid:#1a1a1a0b; --surface:#ffffff; --surface-2:#f4f2ea;
  --ink:#1a1a1a; --ink-2:#4b5652; --muted:#6b7280; --hair:#1a1a1a22; --line-2:#1a1a1a44;
  --blue:#3b5bdb; --teal:#12b5a5; --mint:#e1f6f2; --info-soft:#e8edff;
  --nav:#141e10; --nav-ink:#f5f0e8; --nav-dim:#c0c7b7; --soft-shadow:#dddccf; --on-accent:#ffffff;
  --good:#0b7f74; --crit:#d42a20;
  --sans:Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#141716; --grid:#f1f1ec0f; --surface:#1c201f; --surface-2:#232826;
  --ink:#f1f1ec; --ink-2:#c7c9c2; --muted:#a3a7a1; --hair:#f1f1ec2e; --line-2:#f1f1ec55;
  --blue:#8ea2ff; --teal:#2fcbbb; --mint:#173b37; --info-soft:#202a4d;
  --nav:#0d120b; --nav-ink:#f5f0e8; --nav-dim:#c0c7b7; --soft-shadow:#2b2f23; --on-accent:#0f1412;
  --good:#63d9cc; --crit:#ff7b72; color-scheme:dark}}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0}
body{
  background-color:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;letter-spacing:-.02em;word-break:keep-all;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.mast{background:var(--nav);color:var(--nav-ink);border-bottom:2px solid var(--ink);padding-top:env(safe-area-inset-top,0px)}
.mast .wrap{padding-block:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:-.04em;font-size:15px}
.brand span{color:var(--nav-dim);font-weight:400;margin-left:8px;font-size:13px}
.roll{display:flex;gap:5px;align-items:center}
.roll .dot{width:16px;height:16px;border:2px solid var(--nav-dim)}
.roll .dot.on{background:var(--teal);border-color:var(--teal)}
.roll .lbl{font-size:13px;margin-left:8px;font-variant-numeric:tabular-nums}

.head .wrap{padding-block:32px 8px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--blue);text-transform:uppercase;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:900;letter-spacing:-.06em;line-height:1.3;margin:6px 0 4px;text-wrap:balance}
h1 em{font-style:normal;color:var(--blue)}
.lead{color:var(--ink-2);margin:0;max-width:60ch}

main .wrap{padding-block:20px 48px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){main .wrap{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--soft-shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--hair)}
.card-title{font-size:15px;font-weight:850;letter-spacing:-.04em;margin:0}
.card-body{padding:16px 18px;display:grid;gap:18px}
.hint{font-size:12px;color:var(--muted);margin:0}

.step{display:grid;gap:10px}
.step + .step{border-top:1px solid var(--hair);padding-top:16px}
.step-title{font-size:16px;font-weight:900;letter-spacing:-.04em;margin:2px 0 0}
input[type=text]{width:100%;padding:10px 12px;border:2px solid var(--ink);background:var(--surface);min-width:0;font-size:16px}
input[type=text]::placeholder{color:var(--muted)}

.proxy{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--mint);border:1px solid var(--teal);padding:8px 12px;font-size:13px;color:var(--ink-2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pick{border:2px solid var(--ink);background:var(--surface);padding:10px 12px;text-align:left;font-weight:700;font-size:15px;line-height:1.35;min-height:56px;transition:transform .12s,box-shadow .12s}
.pick:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
.pick[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}

.btn{border:2px solid var(--ink);background:var(--surface);padding:8px 14px;font-weight:700;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
.btn.primary{background:var(--blue);color:var(--on-accent);padding:11px 20px;font-weight:900}
.btn.small{padding:4px 10px;font-size:13px}
.btn.quiet{border-color:var(--line-2);color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.savebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:2px solid var(--ink);padding:14px 18px;background:var(--surface-2)}
.status{font-size:13px;color:var(--muted)}
.status.ok{color:var(--good);font-weight:700} .status.err{color:var(--crit);font-weight:700}
.note{background:var(--mint);border:1px solid var(--teal);padding:10px 12px;font-size:13px;color:var(--ink-2);margin:0}

.person{padding:10px 0;border-top:1px solid var(--hair);display:flex;justify-content:space-between;gap:8px;align-items:center}
.person:first-child{border-top:0;padding-top:0}
.person .nm{font-weight:900;letter-spacing:-.04em}
.person .nm small{font-weight:700;font-size:11px;margin-left:6px;padding:1px 6px;background:var(--info-soft);color:var(--blue)}
.person .food{font-size:14px;color:var(--ink-2)}
.person .info{display:grid;min-width:0}
.empty{color:var(--muted);font-size:13px;border:1px dashed var(--line-2);padding:18px;text-align:center}
.people-foot{display:flex;justify-content:flex-end}

footer .wrap{border-top:2px solid var(--ink);padding-block:12px 28px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="mast">
  <div class="wrap">
    <div class="brand">소소숲 : 지혜의 기록소<span>점심 주문판</span></div>
    <div class="roll" id="roll" aria-label="주문 완료 인원"></div>
  </div>
</header>

<section class="head">
  <div class="wrap">
    <p class="eyebrow">11.07 SAT / LUNCH ORDER</p>
    <h1>점심메뉴, <em>골라주세요.</em></h1>
    <p class="lead">바르다김선생 김밥을 골라 주세요. 저장하면 모두에게 바로 보이고, 언제든 다시 바꿀 수 있어요.</p>
  </div>
</section>

<main>
  <div class="wrap">
    <section class="card" aria-labelledby="formTitle">
      <div class="card-head"><h2 class="card-title" id="formTitle">내 메뉴 고르기</h2><span class="hint">로그인 없이 저장돼요</span></div>
      <div class="card-body">
        <div class="proxy" id="proxyBar" hidden>
          <span id="proxyText"></span>
          <button class="btn small" id="backMine" type="button">내 주문으로 돌아가기</button>
        </div>

        <div class="step">
          <p class="eyebrow">01 / NAME</p>
          <label class="step-title" for="name">이름</label>
          <input type="text" id="name" maxlength="20" placeholder="예: 승윤" autocomplete="off">
        </div>

        <div class="step">
          <p class="eyebrow">02 / KIMBAP</p>
          <h3 class="step-title">바르다김선생 김밥</h3>
          <div class="grid" id="foods"></div>
        </div>
        <p class="note" id="notice" hidden></p>
      </div>
      <div class="savebar">
        <button class="btn primary" type="button" id="save">주문 저장</button>
        <button class="btn small quiet" type="button" id="del" hidden>내 주문 지우기</button>
        <span class="status" id="status" role="status"></span>
      </div>
    </section>

    <section class="card" aria-labelledby="peopleTitle">
      <div class="card-head"><h2 class="card-title" id="peopleTitle">모두의 주문</h2><span class="hint" id="peopleHint">불러오는 중…</span></div>
      <div class="card-body">
        <div id="people"><div class="empty">주문을 불러오는 중이에요…</div></div>
        <div class="people-foot"><button class="btn small" type="button" id="proxyBtn">+ 다른 분 몫 대신 입력</button></div>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap"><span>바르다김선생 배달 / 6명</span><span>소소숲 : 지혜의 기록소</span></div>
</footer>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getDatabase, ref, onValue, set, remove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  // book-challenge와 같은 파이어베이스 프로젝트, 저장 위치만 lunch/ 로 분리
  const firebaseConfig = {
    apiKey: 'AIzaSyB2rNfkTOrbEDg4ewldG1Ts_IKyK2AP5nI',
    authDomain: 'book-challenge-a90c7.firebaseapp.com',
    databaseURL: 'https://book-challenge-a90c7-default-rtdb.firebaseio.com',
    projectId: 'book-challenge-a90c7',
    storageBucket: 'book-challenge-a90c7.firebasestorage.app',
    messagingSenderId: '577173257924',
    appId: '1:577173257924:web:8753558b21629b8ddc1391',
  };
  const db = getDatabase(initializeApp(firebaseConfig));
  const ORDERS = 'lunch/orders';

  const TARGET = 6;
  const FOODS = ['참치김밥', '돈가스김밥', '새우튀김김밥', '매운제육쌈김밥', '크림치즈호두김밥', '매운 멸추 김밥'];

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const newId = () => 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // 로그인이 없으니 이 기기를 기억해서 "내 주문"을 찾는다
  let myId;
  try { myId = localStorage.getItem('lunchOrderId'); if (!myId) { myId = newId(); localStorage.setItem('lunchOrderId', myId); } }
  catch { myId = newId(); }
  const rememberMine = id => { myId = id; try { localStorage.setItem('lunchOrderId', id); } catch {} };

  let orders = {};          // id -> {name, food, at}
  let target = myId;        // 지금 고치는 주문
  let draft = { name: '', food: null };
  let dirty = false, connected = false;

  function renderFoods() {
    $('foods').innerHTML = FOODS.map(n =>
      `<button type="button" class="pick" data-food="${esc(n)}" aria-pressed="${draft.food === n}">${esc(n)}</button>`).join('');
  }
  function renderForm() {
    renderFoods();
    const isProxy = target !== myId;
    $('proxyBar').hidden = !isProxy;
    if (isProxy) {
      const o = orders[target];
      $('proxyText').textContent = o ? `${o.name || '이름 없음'}님 주문을 고치고 있어요` : '다른 분 몫을 대신 입력하고 있어요. 그분 이름을 적어 주세요';
    }
    $('del').hidden = !orders[target];
    if (!delArmed) $('del').textContent = isProxy ? '이 주문 지우기' : '내 주문 지우기';
  }
  function load(id) {
    const o = orders[id];
    draft = { name: o?.name || '', food: o && FOODS.includes(o.food) ? o.food : null };
    $('name').value = draft.name;
  }
  function setStatus(t, cls) { const s = $('status'); s.textContent = t; s.className = 'status' + (cls ? ' ' + cls : ''); }

  function renderBoard() {
    const list = Object.entries(orders).sort((a, b) => (a[1].at || 0) - (b[1].at || 0));
    const n = list.length;
    let dots = '';
    for (let i = 0; i < Math.max(TARGET, n); i++) dots += `<span class="dot ${i < n ? 'on' : ''}"></span>`;
    $('roll').innerHTML = dots + `<span class="lbl">${n} / ${TARGET}명</span>`;
    $('peopleHint').textContent = n >= TARGET ? '모두 골랐어요' : `${TARGET - n}명 남았어요`;
    $('people').innerHTML = n ? list.map(([id, o]) => `
      <div class="person">
        <div class="info">
          <span class="nm">${esc(o.name || '이름 없음')}${id === myId ? '<small>나</small>' : ''}</span>
          <span class="food">${esc(o.food || '아직 안 고름')}</span>
        </div>
        ${id !== target ? `<button class="btn small" type="button" data-edit="${esc(id)}">수정</button>` : ''}
      </div>`).join('')
      : `<div class="empty">아직 아무도 고르지 않았어요.<br>첫 주문을 저장해 보세요.</div>`;
  }

  // ── 이벤트 ──
  $('foods').addEventListener('click', e => {
    const b = e.target.closest('[data-food]'); if (!b) return;
    draft.food = b.dataset.food; dirty = true; setStatus(''); renderForm();
  });
  $('name').addEventListener('input', e => { draft.name = e.target.value; dirty = true; setStatus(''); });

  $('save').addEventListener('click', async () => {
    const name = draft.name.trim();
    if (!name) { setStatus('이름을 먼저 적어 주세요', 'err'); $('name').focus(); return; }
    if (!draft.food) { setStatus('김밥을 골라 주세요', 'err'); return; }
    if (!connected) { setStatus('아직 연결 중이에요. 잠시 후 다시 눌러 주세요', 'err'); return; }
    // 다른 기기에서 같은 이름으로 이미 저장했다면 그 주문을 고친다 (중복 방지)
    if (target === myId && !orders[myId]) {
      const same = Object.entries(orders).find(([, o]) => (o.name || '').trim() === name);
      if (same) { target = same[0]; rememberMine(same[0]); }
    }
    $('save').disabled = true; setStatus('저장하는 중…');
    try {
      await set(ref(db, `${ORDERS}/${target}`), { name, food: draft.food, at: orders[target]?.at || Date.now() });
      dirty = false; setStatus('저장했어요', 'ok');
    } catch (err) {
      setStatus(String(err?.code || err?.message || '').toLowerCase().includes('permission')
        ? '저장 권한이 없어요. 주문판 만든 분께 알려 주세요' : '저장하지 못했어요. 잠시 후 다시 눌러 주세요', 'err');
    } finally { $('save').disabled = false; }
  });

  let delArmed = false, delTimer;
  $('del').addEventListener('click', async () => {
    if (!delArmed) {
      delArmed = true; $('del').textContent = '한 번 더 누르면 지워져요';
      clearTimeout(delTimer); delTimer = setTimeout(() => { delArmed = false; renderForm(); }, 3000);
      return;
    }
    delArmed = false; clearTimeout(delTimer);
    try {
      await remove(ref(db, `${ORDERS}/${target}`));
      target = myId; load(myId); dirty = false; setStatus('지웠어요', 'ok'); renderForm();
    } catch { setStatus('지우지 못했어요. 다시 시도해 주세요', 'err'); }
  });

  function editTarget(id) {
    target = id; load(id); dirty = false; setStatus(''); renderForm(); renderBoard();
    $('formTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  $('people').addEventListener('click', e => { const b = e.target.closest('[data-edit]'); if (b) editTarget(b.dataset.edit); });
  $('backMine').addEventListener('click', () => editTarget(myId));
  $('proxyBtn').addEventListener('click', () => editTarget(newId()));

  // ── 실시간 구독 ──
  renderForm();
  const slow = setTimeout(() => { if (!connected) $('peopleHint').textContent = '연결이 느려요…'; }, 10000);
  onValue(ref(db, ORDERS), snap => {
    clearTimeout(slow);
    connected = true;
    orders = snap.val() || {};
    if (!dirty && orders[target]) load(target);
    renderBoard(); renderForm();
  }, err => {
    clearTimeout(slow);
    $('peopleHint').textContent = '연결 오류';
    $('people').innerHTML = `<div class="empty">주문 목록을 불러올 수 없어요.<br>(${esc(err?.code || err?.message || '')})</div>`;
    const n = $('notice'); n.hidden = false;
    n.textContent = '저장소에 연결하지 못했어요. 파이어베이스 규칙에서 lunch 칸이 열려 있는지 확인이 필요해요.';
  });
</script>
</body>
</html>
